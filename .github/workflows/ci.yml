name: CI

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
      
      - name: Display coverage
        run: go tool cover -func=coverage.out
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      
      - name: Build for all platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -o vibesortmedia-linux-amd64
          GOOS=darwin GOARCH=amd64 go build -o vibesortmedia-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -o vibesortmedia-darwin-arm64
          GOOS=windows GOARCH=amd64 go build -o vibesortmedia-windows-amd64.exe
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            vibesortmedia-linux-amd64
            vibesortmedia-darwin-amd64
            vibesortmedia-darwin-arm64
            vibesortmedia-windows-amd64.exe
          retention-days: 7
